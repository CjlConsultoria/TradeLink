spring.application.name=CJLInvestimentos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Banco: em produção (Rancher) defina SPRING_DATASOURCE_URL, USERNAME, PASSWORD no ambiente.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cjlinvestimentos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tabelas criadas/atualizadas automaticamente na subida.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origins=http://localhost:5173

# Cotacoes - APIs gratuitas (AwesomeAPI forex + CoinGecko crypto)
# Intervalo principal (ms): 600000 = 10 min
app.cotacao.interval=600000
app.cotacao.initial-delay=5000
app.cotacao.initial-delay-crypto=30000
app.cotacao.historico-interval=3600000
app.cotacao.historico-initial-delay=120000
# CoinGecko: API key demo (opcional, melhora rate limit de 15 → 30 req/min)
# Criar em https://www.coingecko.com/en/api (gratuito)
app.cotacao.coingecko.api-key=${COINGECKO_API_KEY:CG-U8ELRLKesBqaKBapxpYeXVc9}

# Notificações (opcional - deixe vazio para desabilitar)
# E-mail: remetente e configurar spring.mail.*
# app.notificacao.email.from=noreply@seudominio.com
