spring.application.name=CJLInvestimentos

# Banco: em produção (Rancher) defina SPRING_DATASOURCE_URL, USERNAME, PASSWORD no ambiente.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cjlinvestimentos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tabelas criadas/atualizadas automaticamente na subida.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origins=http://localhost:5173

# Scheduler - intervalo de busca de cotações (ms). 600000 = 10 min (evita 429 das APIs gratuitas)
app.cotacao.awesome-api.interval=600000
app.cotacao.coingecko.interval=600000

# URLs das APIs de cotacao
app.cotacao.awesome-api.url=https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CHF-BRL,CAD-BRL,AUD-BRL,NZD-BRL,CNY-BRL,ARS-BRL,MXN-BRL,BTC-BRL,ETH-BRL
app.cotacao.coingecko.url=https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,ripple,solana,cardano,dogecoin,polkadot,avalanche-2,matic-network,chainlink,uniswap,litecoin&vs_currencies=usd,brl

# Notificações (opcional - deixe vazio para desabilitar)
# E-mail: remetente e configurar spring.mail.*
# app.notificacao.email.from=noreply@seudominio.com
# spring.mail.host=smtp.exemplo.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=

# Telegram: token do bot (criar em @BotFather). Usuários informam o chat_id no app.
# app.notificacao.telegram.bot-token=

# Web Push: chaves VAPID (gerar com: npx web-push generate-vapid-keys)
# app.notificacao.push.vapid-public=
# app.notificacao.push.vapid-private=

# Stripe - pagamentos (opcional). Em produção defina no ambiente ou em application-local.properties
stripe.api-key=${STRIPE_API_KEY:}
# stripe.webhook-secret=whsec_...  (obrigatório para gerar faturas ao receber pagamento)
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/admin-max/empresas}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/admin-max/empresas}
stripe.success-url-pagamento-consultor=${STRIPE_SUCCESS_URL_PAGAMENTO_CONSULTOR:http://localhost:5173/consultor/faturas?pagamento=ok}
stripe.cancel-url-pagamento-consultor=${STRIPE_CANCEL_URL_PAGAMENTO_CONSULTOR:http://localhost:5173/consultor/faturas}
stripe.success-url-pagamento-cliente=${STRIPE_SUCCESS_URL_PAGAMENTO_CLIENTE:http://localhost:5173/cliente/faturas?pagamento=ok}
stripe.cancel-url-pagamento-cliente=${STRIPE_CANCEL_URL_PAGAMENTO_CLIENTE:http://localhost:5173/cliente/faturas}
