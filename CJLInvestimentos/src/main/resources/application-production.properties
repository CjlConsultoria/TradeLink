# Profile production (Rancher/K8s): use variáveis de ambiente para secrets.
# Defina no Rancher: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
# ADMIN_INITIAL_EMAIL, ADMIN_INITIAL_PASSWORD (opcional; se não definir, senha é gerada e logada).

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false

# CORS: ajuste para a URL do front em produção
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# E-mail: remetente fixo. Defina MAIL_PASSWORD no Rancher (Secret) com a SENHA DE APP do Gmail
# (não use senha normal: ative Verificação em 2 etapas e crie em https://myaccount.google.com/apppasswords).
# Veja docs/CONFIGURAR-EMAIL-GMAIL.md
app.notificacao.email.from=cjlconsultoria.consultor@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cjlconsultoria.consultor@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

