# Profile Render: igual ao application (HEAD), só muda o banco para o PostgreSQL do Render.
# Ativar: SPRING_PROFILES_ACTIVE=render no Render.

spring.application.name=CJLInvestimentos

# Porta: Render define PORT; sem PORT usa 8080 (local).
server.port=${PORT:8080}

# Banco Render (só isso muda em relação ao que já funciona)
spring.datasource.url=jdbc:postgresql://dpg-d64frav5r7bs73af550g-a:5432/cjlinvestimentos
spring.datasource.username=cjlinvestimentos_user
spring.datasource.password=yLpUrn6CP87DQrWUOXe8pedcqfXrhlCv
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabelas criadas/atualizadas automaticamente na subida.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS: front publicado no Render + localhost para dev
# Incluir capacitor://localhost e https://localhost para os apps iOS/Android (Capacitor)
app.cors.allowed-origins=https://tradelink-grun.onrender.com,http://localhost:5173,capacitor://localhost,https://localhost

# Scheduler - cotações a cada 10 min. Atrasos iniciais escalonados (2min, 2min30s, 3min, 3min30s) para reduzir 429.
app.cotacao.awesome-api.interval=600000
app.cotacao.coingecko.interval=600000
app.cotacao.binance.interval=600000
app.cotacao.coincap.interval=600000
app.cotacao.initial-delay=120000
app.cotacao.initial-delay-coingecko=150000
app.cotacao.initial-delay-binance=180000
app.cotacao.initial-delay-coincap=210000

# URLs das APIs de cotacao
app.cotacao.awesome-api.url=https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CHF-BRL,CAD-BRL,AUD-BRL,NZD-BRL,CNY-BRL,ARS-BRL,MXN-BRL,BTC-BRL,ETH-BRL
