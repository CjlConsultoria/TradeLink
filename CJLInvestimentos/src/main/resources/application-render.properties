# Profile Render: igual ao application (HEAD), só muda o banco para o PostgreSQL do Render.
# Ativar: SPRING_PROFILES_ACTIVE=render no Render.

spring.application.name=CJLInvestimentos

# Banco Render (só isso muda em relação ao que já funciona)
spring.datasource.url=jdbc:postgresql://dpg-d64frav5r7bs73af550g-a:5432/cjlinvestimentos
spring.datasource.username=cjlinvestimentos_user
spring.datasource.password=yLpUrn6CP87DQrWUOXe8pedcqfXrhlCv
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabelas criadas/atualizadas automaticamente na subida.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS: front publicado no Render + localhost para dev
app.cors.allowed-origins=https://tradelink-grun.onrender.com,http://localhost:5173

# Scheduler - intervalo de busca de cotacoes (ms)
app.cotacao.awesome-api.interval=300000
app.cotacao.coingecko.interval=300000

# URLs das APIs de cotacao
app.cotacao.awesome-api.url=https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CHF-BRL,CAD-BRL,AUD-BRL,NZD-BRL,CNY-BRL,ARS-BRL,MXN-BRL,BTC-BRL,ETH-BRL
app.cotacao.coingecko.url=https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,ripple,solana,cardano,dogecoin,polkadot,avalanche-2,matic-network,chainlink,uniswap,litecoin&vs_currencies=usd,brl

