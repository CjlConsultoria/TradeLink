# Profile Render: igual ao application (HEAD), só muda o banco para o PostgreSQL do Render.
# Ativar: SPRING_PROFILES_ACTIVE=render no Render.

spring.application.name=CJLInvestimentos

# Porta: Render define PORT; sem PORT usa 8080 (local).
server.port=${PORT:8080}

# Banco Render (só isso muda em relação ao que já funciona)
spring.datasource.url=jdbc:postgresql://dpg-d64frav5r7bs73af550g-a:5432/cjlinvestimentos
spring.datasource.username=cjlinvestimentos_user
spring.datasource.password=yLpUrn6CP87DQrWUOXe8pedcqfXrhlCv
spring.datasource.driver-class-name=org.postgresql.Driver

# Tabelas criadas/atualizadas automaticamente na subida.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS: front publicado no Render + localhost para dev
# Incluir capacitor://localhost e https://localhost para os apps iOS/Android (Capacitor)
app.cors.allowed-origins=https://tradelinkinvest.com.br,https://www.tradelinkinvest.com.br,https://tradelink-grun.onrender.com,http://localhost:5173,capacitor://localhost,https://localhost

# Cotacoes - APIs gratuitas (AwesomeAPI forex + CoinGecko crypto)
app.cotacao.interval=600000
app.cotacao.initial-delay=120000
app.cotacao.initial-delay-crypto=150000
app.cotacao.historico-interval=3600000
app.cotacao.historico-initial-delay=300000
# CoinGecko: API key demo (opcional). Defina COINGECKO_API_KEY no Render (Environment)
app.cotacao.coingecko.api-key=${COINGECKO_API_KEY:}

# Notificações - E-mail no Render: use Resend (API HTTPS, funciona no Render). Não use Gmail SMTP (porta 587 bloqueada).
# 1) Crie conta em https://resend.com (plano gratuito: 100 e-mails/dia).
# 2) Em Environment do Render: RESEND_API_KEY = sua API key (começa com re_).
# 3) Remetente: use e-mail do domínio verificado no Resend (ex.: noreply@tradelinkinvest.com.br).
# Veja docs/CONFIGURAR-EMAIL-GMAIL.md (seção Resend).
app.notificacao.email.from=TradeLink <noreply@tradelinkinvest.com.br>
# RESEND_API_KEY defina no Render → Environment (não coloque aqui)
# spring.mail.* não é usado quando RESEND_API_KEY está definido
