# Build do app iOS (IPA) para publicar na App Store.
# Roda em runner macOS (GitHub fornece). Sem Mac na sua máquina.
# Secrets para assinatura (Apple Developer):
#   APPLE_DEVELOPMENT_TEAM (Team ID, 10 caracteres)
#   IOS_CERTIFICATE_BASE64 (certificado .p12 em base64)
#   IOS_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64 (perfil .mobileprovision em base64)

name: Build iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'tradelink-frontend/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tradelink-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tradelink-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Install Apple certificate and profile
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > build.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > build.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import build.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build and archive iOS
        run: |
          cd ios/App
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            xcodebuild -project App.xcodeproj -scheme App -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive archive \
              DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
              CODE_SIGN_STYLE=Automatic \
              -allowProvisioningUpdates
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive archive \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: Create ExportOptions.plist (para export IPA)
        if: ${{ secrets.APPLE_DEVELOPMENT_TEAM != '' }}
        run: |
          mkdir -p ios/App
          TEAM="${{ secrets.APPLE_DEVELOPMENT_TEAM }}"
          cat > ios/App/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM}</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: ${{ secrets.APPLE_DEVELOPMENT_TEAM != '' }}
        run: |
          cd ios/App
          xcodebuild -exportArchive -archivePath App.xcarchive \
            -exportPath . -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        if: ${{ secrets.APPLE_DEVELOPMENT_TEAM != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: tradelink-frontend/ios/App/App.ipa