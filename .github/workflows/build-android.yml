# Build do app Android (AAB) para publicar na Google Play.
# Gera o artefato sem precisar do Android Studio na sua máquina.
# Secrets opcionais para assinatura (para publicar na loja):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Build Android (AAB)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'tradelink-frontend/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradelink-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tradelink-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Decode keystore (release)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/tradelink-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App Bundle (AAB) - Release (assinado)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cd android && ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_BASE64: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android App Bundle (AAB) - Debug (sem assinatura, para testar)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: cd android && ./gradlew bundleDebug

      - name: Upload AAB (release)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: tradelink-frontend/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB (debug)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-debug
          path: tradelink-frontend/android/app/build/outputs/bundle/debug/app-debug.aab
